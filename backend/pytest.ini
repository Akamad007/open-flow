[pytest]
testpaths = tests
# tests/integration holds manual GPU smoke scripts (smoke_*.py, not pytest tests);
# ignored so the default suite stays offline. See tests/integration/README.md.
addopts = --ignore=tests/integration
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    slow: tests that touch a Postgres container or external services
