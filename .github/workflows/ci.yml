name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (critical errors gate)
        run: ruff check app --select E9,F63,F7,F82
      - name: Lint (full, informational)
        run: ruff check app || true
      - name: Type-check (informational)
        run: mypy app || true
      - name: Tests (offline / stub providers)
        env:
          LLM_PROVIDER: stub
          VIDEO_PROVIDER: stub
          AUDIO_PROVIDER: stub
          IMAGE_PROVIDER: stub
        run: pytest -m "not slow" --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm install
      - name: Type-check + build (gate)
        run: npm run build
      - name: Lint (informational)
        run: npm run lint || true
      - name: Unit tests (informational)
        run: npm test || true
